server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page-app routing: serve index.html for any unknown path so deep
    # links and refreshes work (e.g. /generate, /results).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API calls to the backend service (used only in real mode /
    # docker-compose). Using a variable + Docker's embedded DNS resolver means
    # nginx still starts when no backend is present (e.g. the mock-only image).
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # Long cache for hashed static assets.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
