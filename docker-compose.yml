# ---------------------------------------------------------------------------
# AssessIQ — full stack (backend + frontend) in one command:
#   docker compose up --build
# Then open http://localhost:8080  (frontend proxies /api to the backend).
#
# For LLM-quality generation, set ASSESSIQ_LLM_PROVIDER=openai and provide
# OPENAI_API_KEY (e.g. in a .env file next to this compose file).
# ---------------------------------------------------------------------------
services:
  postgres:
    image: postgres:16-alpine
    container_name: assessiq_postgres
    environment:
      POSTGRES_DB: assessiq
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    expose:
      - "5432"
    # Uncomment to connect from host for debugging:
    # ports:
    #   - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      # Set to "true" for real Sentence-Transformers + FAISS (large image):
      args:
        INSTALL_ML: "false"
    environment:
      ASSESSIQ_LLM_PROVIDER: ${ASSESSIQ_LLM_PROVIDER:-offline}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-}
      ASSESSIQ_DATA_DIR: /data
      ASSESSIQ_MIN_DOCUMENT_CHARS: ${ASSESSIQ_MIN_DOCUMENT_CHARS:-15000}
      ASSESSIQ_SECRET: ${ASSESSIQ_SECRET:-change-me-in-production}
      ASSESSIQ_VECTOR_DB: faiss
      ASSESSIQ_USE_SQL_DB: "true"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: assessiq
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - assessiq_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    # Uncomment to reach the API directly from the host for debugging:
    # ports:
    #   - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_MODE: real
        VITE_API_BASE_URL: ""   # same-origin; nginx proxies /api -> backend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  assessiq_data:
  postgres_data:
